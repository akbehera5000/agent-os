<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07070c"/><stop offset="1" stop-color="#0e0b16"/></linearGradient>
  </defs>
  <rect width="1200" height="640" rx="22" fill="url(#bg)"/>
  <text x="48" y="58" fill="#f97316" font-size="13" font-weight="700" letter-spacing="3">WHAT'S INSIDE</text>
  <text x="48" y="92" fill="#ededf4" font-size="26" font-weight="600">12 tools in one command center for every AI on your Mac</text>
  <g font-size="14">
    <!-- row 1 -->
    <g transform="translate(48,124)"><rect width="262" height="148" rx="14" fill="#101016" stroke="#f97316" stroke-opacity="0.45"/><circle cx="30" cy="32" r="9" fill="#f97316"/><text x="50" y="37" fill="#ededf4" font-weight="600" font-size="16">Living 3D brain</text><text x="20" y="72" fill="#9a9aaa">Every session, skill and file is</text><text x="20" y="94" fill="#9a9aaa">a clickable planet. Metal, 120 Hz,</text><text x="20" y="116" fill="#9a9aaa">9 styles from galaxy to black hole.</text></g>
    <g transform="translate(330,124)"><rect width="262" height="148" rx="14" fill="#101016" stroke="#22d3ee" stroke-opacity="0.45"/><circle cx="30" cy="32" r="9" fill="#22d3ee"/><text x="50" y="37" fill="#ededf4" font-weight="600" font-size="16">Jarvis assistant</text><text x="20" y="72" fill="#9a9aaa">Talk or type. Instant local answers,</text><text x="20" y="94" fill="#9a9aaa">offline Apple / Ollama models, or</text><text x="20" y="116" fill="#9a9aaa">Claude. ⌥⌘J from any app.</text></g>
    <g transform="translate(612,124)"><rect width="262" height="148" rx="14" fill="#101016" stroke="#eab308" stroke-opacity="0.45"/><circle cx="30" cy="32" r="9" fill="#eab308"/><text x="50" y="37" fill="#ededf4" font-weight="600" font-size="16">Cost &amp; token tracker</text><text x="20" y="72" fill="#9a9aaa">5-hour / 7-day budgets, spend by</text><text x="20" y="94" fill="#9a9aaa">project, model and skill, cache</text><text x="20" y="116" fill="#9a9aaa">hit rate. ₹ or $, live.</text></g>
    <g transform="translate(894,124)"><rect width="258" height="148" rx="14" fill="#101016" stroke="#3b82f6" stroke-opacity="0.45"/><circle cx="30" cy="32" r="9" fill="#3b82f6"/><text x="50" y="37" fill="#ededf4" font-weight="600" font-size="16">Project passports</text><text x="20" y="72" fill="#9a9aaa">Every copy of a project, every</text><text x="20" y="94" fill="#9a9aaa">tool that touched it, and one-</text><text x="20" y="116" fill="#9a9aaa">click resume of any session.</text></g>
    <!-- row 2 -->
    <g transform="translate(48,292)"><rect width="262" height="148" rx="14" fill="#101016" stroke="#22c55e" stroke-opacity="0.45"/><circle cx="30" cy="32" r="9" fill="#22c55e"/><text x="50" y="37" fill="#ededf4" font-weight="600" font-size="16">Corrections → rules</text><text x="20" y="72" fill="#9a9aaa">Finds the times you corrected an</text><text x="20" y="94" fill="#9a9aaa">AI and turns them into rules for</text><text x="20" y="116" fill="#9a9aaa">CLAUDE.md, AGENTS.md, GEMINI.md.</text></g>
    <g transform="translate(330,292)"><rect width="262" height="148" rx="14" fill="#101016" stroke="#f97316" stroke-opacity="0.45"/><circle cx="30" cy="32" r="9" fill="#f97316"/><text x="50" y="37" fill="#ededf4" font-weight="600" font-size="16">Skill sync matrix</text><text x="20" y="72" fill="#9a9aaa">See which skill lives in which</text><text x="20" y="94" fill="#9a9aaa">AI app; install it everywhere</text><text x="20" y="116" fill="#9a9aaa">with one click. Retire unused ones.</text></g>
    <g transform="translate(612,292)"><rect width="262" height="148" rx="14" fill="#101016" stroke="#a855f7" stroke-opacity="0.45"/><circle cx="30" cy="32" r="9" fill="#a855f7"/><text x="50" y="37" fill="#ededf4" font-weight="600" font-size="16">MCP connector health</text><text x="20" y="72" fill="#9a9aaa">Every MCP server across all apps,</text><text x="20" y="94" fill="#9a9aaa">with broken commands flagged</text><text x="20" y="116" fill="#9a9aaa">before they fail mid-task.</text></g>
    <g transform="translate(894,292)"><rect width="258" height="148" rx="14" fill="#101016" stroke="#eab308" stroke-opacity="0.45"/><circle cx="30" cy="32" r="9" fill="#eab308"/><text x="50" y="37" fill="#ededf4" font-weight="600" font-size="16">Routines</text><text x="20" y="72" fill="#9a9aaa">Scheduled briefings, cost digests,</text><text x="20" y="94" fill="#9a9aaa">memory capture and your own</text><text x="20" y="116" fill="#9a9aaa">prompts, with weekly caps.</text></g>
    <!-- row 3 -->
    <g transform="translate(48,460)"><rect width="262" height="148" rx="14" fill="#101016" stroke="#22c55e" stroke-opacity="0.45"/><circle cx="30" cy="32" r="9" fill="#22c55e"/><text x="50" y="37" fill="#ededf4" font-weight="600" font-size="16">Memory filler</text><text x="20" y="72" fill="#9a9aaa">Turns finished sessions into</text><text x="20" y="94" fill="#9a9aaa">Basic Memory notes every AI app</text><text x="20" y="116" fill="#9a9aaa">can read next time.</text></g>
    <g transform="translate(330,460)"><rect width="262" height="148" rx="14" fill="#101016" stroke="#ec4899" stroke-opacity="0.45"/><circle cx="30" cy="32" r="9" fill="#ec4899"/><text x="50" y="37" fill="#ededf4" font-weight="600" font-size="16">Clutter janitor</text><text x="20" y="72" fill="#9a9aaa">Spare workspaces, stale worktrees</text><text x="20" y="94" fill="#9a9aaa">and duplicate zips, moved to Trash</text><text x="20" y="116" fill="#9a9aaa">only when you confirm.</text></g>
    <g transform="translate(612,460)"><rect width="262" height="148" rx="14" fill="#101016" stroke="#22d3ee" stroke-opacity="0.45"/><circle cx="30" cy="32" r="9" fill="#22d3ee"/><text x="50" y="37" fill="#ededf4" font-weight="600" font-size="16">⌘K zero-token search</text><text x="20" y="72" fill="#9a9aaa">Projects, sessions, skills, notes</text><text x="20" y="94" fill="#9a9aaa">and files, searched on-device in</text><text x="20" y="116" fill="#9a9aaa">milliseconds. No LLM calls.</text></g>
    <g transform="translate(894,460)"><rect width="258" height="148" rx="14" fill="#101016" stroke="#3b82f6" stroke-opacity="0.45"/><circle cx="30" cy="32" r="9" fill="#3b82f6"/><text x="50" y="37" fill="#ededf4" font-weight="600" font-size="16">Native &amp; fast</text><text x="20" y="72" fill="#9a9aaa">SwiftUI + Metal, tuned for Apple</text><text x="20" y="94" fill="#9a9aaa">Silicon. Menu bar companion,</text><text x="20" y="116" fill="#9a9aaa">open at login, ~1% CPU idle.</text></g>
  </g>
</svg>
