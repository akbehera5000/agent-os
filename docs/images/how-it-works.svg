    <text x="68" y="192"><tspan fill="#f97316">●</tspan> Claude Code  ~/.claude</text>
    <text x="68" y="220"><tspan fill="#f97316">●</tspan> Claude Desktop</text>
    <text x="68" y="248"><tspan fill="#22c55e">●</tspan> Codex  ~/.codex</text>
    <text x="68" y="276"><tspan fill="#3b82f6">●</tspan> Gemini · Antigravity</text>
    <text x="68" y="304"><tspan fill="#a855f7">●</tspan> GitHub Copilot</text>
    <text x="68" y="332"><tspan fill="#22d3ee">●</tspan> OpenCode · Qwen Code</text>
