  <text x="820" y="462" fill="#9a9aaa" font-size="12.5" text-anchor="middle">every node clickable · 9 visual styles</text>

  <path d="M944 295 L1008 295" stroke="url(#flow)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1016" y="130" width="140" height="330" rx="14" fill="#101016" stroke="#222230"/>
  <text x="1032" y="160" fill="#9a9aaa" font-size="11" font-weight="700" letter-spacing="2">YOU GET</text>
  <g font-size="13" fill="#ededf4">
    <text x="1032" y="194">Jarvis (voice)</text>
    <text x="1032" y="222">Cost &amp; tokens</text>
    <text x="1032" y="250">Project passports</text>
