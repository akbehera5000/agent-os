  </g>

  <path d="M310 295 L392 295" stroke="url(#flow)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="400" y="190" width="230" height="210" rx="14" fill="#101016" stroke="#34344a"/>
  <text x="420" y="220" fill="#9a9aaa" font-size="11" font-weight="700" letter-spacing="2">LOCAL SCANNER</text>
  <text x="420" y="252" fill="#ededf4" font-size="15" font-weight="600">Read-only, parallel</text>
  <text x="420" y="280" fill="#9a9aaa" font-size="13">• all CPU cores</text>
  <text x="420" y="304" fill="#9a9aaa" font-size="13">• cached by file date</text>
  <text x="420" y="328" fill="#9a9aaa" font-size="13">• tokens → ₹ / $ cost</text>
  <text x="420" y="352" fill="#9a9aaa" font-size="13">• zero tokens to search</text>
  <text x="420" y="376" fill="#22c55e" font-size="13" font-weight="600">Nothing leaves your Mac</text>

  <path d="M642 295 L722 295" stroke="url(#flow)" stroke-width="3" marker-end="url(#arrow)"/>

  <circle cx="820" cy="295" r="120" fill="url(#glow)"/>
  <ellipse cx="820" cy="295" rx="92" ry="34" fill="none" stroke="#f97316" stroke-opacity="0.6" stroke-width="2"/>
  <ellipse cx="820" cy="295" rx="64" ry="22" fill="none" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="3 6"/>
  <circle cx="820" cy="295" r="22" fill="#ffe7c2"/>
  <circle cx="745" cy="276" r="9" fill="#22c55e"/><circle cx="902" cy="282" r="8" fill="#3b82f6"/>
  <circle cx="870" cy="320" r="10" fill="#f97316"/><circle cx="786" cy="322" r="6" fill="#ec4899"/>
